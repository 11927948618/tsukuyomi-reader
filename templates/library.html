<section class="screen" id="libraryScreen">
  <div class="container">
    <p class="status">TXT / EPUB / HTML / バックアップZIP を読み込みます。</p>

    <div class="grid cols-2 library-grid">
      <div class="card library-card-stack">
        <label class="label" for="txtEncoding">TXT文字コード</label>
        <select class="input" id="txtEncoding">
          <option value="auto" selected>自動判別</option>
          <option value="utf-8">UTF-8</option>
          <option value="shift_jis">Shift_JIS（CP932）</option>
        </select>

        <label class="label" for="txtInput">TXT / EPUB読み込み</label>
        <input class="input" id="txtInput" type="file" accept=".txt,.epub,text/plain,application/epub+zip" />
      </div>

      <div class="card">
        <label class="label" for="htmlInput">HTML読み込み</label>
        <input class="input" id="htmlInput" type="file" accept=".html,.htm,text/html" />
      </div>

      <div class="card">
        <label class="label" for="zipInput">バックアップZIP読み込み</label>
        <input class="input" id="zipInput" type="file" accept=".zip,application/zip" />
      </div>

      <div class="card library-card-stack">
        <p class="label">設定メニュー</p>
        <button class="button ghost" id="openReaderSettingsBtn" type="button">読書設定を開く</button>
        <button class="button ghost" id="libraryReloadBtn" type="button">再起動（リロード）</button>
        <button class="button" id="libraryHardReloadBtn" type="button">強制同期（キャッシュ破棄）</button>
      </div>

      <div class="card">
        <p class="label">バックアップZIPを書き出し</p>
        <button class="button" id="exportBtn">現在の本をバックアップZIPとして書き出し</button>
      </div>

      <div class="card">
        <p class="label">ステータス</p>
        <div id="statusMessage" class="status">待機中</div>
      </div>
    </div>

    <pre id="debugDecode" style="white-space:pre-wrap; border:1px solid #ddd; padding:8px; max-height:30vh; overflow:auto;"></pre>
  </div>
</section>
