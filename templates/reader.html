<section class="screen reader-layout" id="readerScreen">
  <div class="reader-topbar" id="readerTopbar">
    <div class="topbar-controls">
      <div class="topbar-group topbar-group-left">
        <button class="button ghost" id="backBtn">Library</button>
        <button class="button ghost" id="tocBtn">章</button>
        <button class="button ghost" id="helpBtn">使い方</button>
        <button class="button ghost" id="settingsBtn">設定</button>
        <span class="mode-badge reader-mode-badge" data-review-auth-badge hidden>限定レビュー・認証中</span>
      </div>

      <div class="topbar-group topbar-group-right">
        <div class="h-scroll-wrap">
          <input id="hScroll" class="h-scroll" type="range" min="0" value="0" step="1" aria-label="読書位置" />
          <span id="hScrollPageInfo" class="h-scroll-page-info" aria-live="polite">1 / 1</span>
        </div>
      </div>
    </div>

    <div class="reader-title" id="bookTitle">-</div>
  </div>

  <div class="reader-main">
    <aside class="toc-panel" id="tocPanel" aria-hidden="true">
      <header class="panel-header">
        <strong>章一覧</strong>
        <button class="button ghost" id="closeTocBtn">閉じる</button>
      </header>
      <ul id="tocList"></ul>
    </aside>

    <div class="reader-viewport" id="readerViewport">
      <article class="reader-content" id="bookContent"></article>
    </div>
    <footer class="copyright-footer reader-copyright"></footer>
  </div>

  <div class="tap-zone" id="tapZone"></div>
  <div class="ui-overlay" id="uiOverlay" aria-hidden="true"></div>

  <aside class="settings-panel" id="settingsPanel" aria-hidden="true">
    <header>
      <strong>表示設定</strong>
      <div class="settings-header-actions">
        <button class="button" id="saveSettingsBtn" type="button">設定を保存</button>
        <button class="button ghost" id="closeSettingsBtn">閉じる</button>
      </div>
    </header>

    <div class="settings-body">
      <section class="settings-group open" data-settings-group>
        <button
          class="settings-group-toggle"
          type="button"
          data-settings-group-toggle
          aria-expanded="true"
          aria-controls="settingsTypographyBody"
        >
          文字組みと表示
        </button>
        <div class="settings-group-body" id="settingsTypographyBody">
          <div class="field">
            <div class="field-head">
              <label class="label" for="fontSizeRange">文字サイズ</label>
              <output class="field-value" id="fontSizeValue" for="fontSizeRange" aria-live="polite">-</output>
            </div>
            <input id="fontSizeRange" type="range" min="80" max="140" step="1" />
          </div>

          <div class="field">
            <label class="label" for="fontFamilySelect">本文フォント</label>
            <select id="fontFamilySelect">
              <option value="system">system（端末標準）</option>
              <option value="mincho">明朝</option>
              <option value="gothic">ゴシック</option>
            </select>
          </div>

          <div class="field">
            <div class="field-head">
              <label class="label" for="lineHeightRange">行間</label>
              <output class="field-value" id="lineHeightValue" for="lineHeightRange" aria-live="polite">-</output>
            </div>
            <input id="lineHeightRange" type="range" min="1.4" max="2.4" step="0.1" />
          </div>

          <div class="field">
            <div class="field-head">
              <label class="label" for="letterSpacingRange">字間</label>
              <output class="field-value" id="letterSpacingValue" for="letterSpacingRange" aria-live="polite">-</output>
            </div>
            <input id="letterSpacingRange" type="range" min="-0.5" max="1.5" step="0.1" />
          </div>

          <div class="field">
            <div class="field-head">
              <label class="label" for="wrapWidthRange">折り返し位置（ページ幅）</label>
              <div class="field-meta">
                <output class="field-value" id="wrapWidthValue" for="wrapWidthRange" aria-live="polite">-</output>
              </div>
            </div>
            <div class="range-with-guide">
              <input id="wrapWidthRange" type="range" min="60" max="130" step="1" />
            </div>
          </div>
        </div>
      </section>

      <section class="settings-group open" data-settings-group>
        <button
          class="settings-group-toggle"
          type="button"
          data-settings-group-toggle
          aria-expanded="true"
          aria-controls="settingsThemeBody"
        >
          モードとテーマ
        </button>
        <div class="settings-group-body" id="settingsThemeBody">
          <div class="field">
            <label class="label" for="themeSelect">テーマ</label>
            <select id="themeSelect">
              <option value="light">Light</option>
              <option value="dark">Dark</option>
            </select>
          </div>

          <div class="field">
            <span class="label">表示モード</span>
            <label><input type="radio" name="displayMode" value="paged" checked /> ページ切替</label>
            <label><input type="radio" name="displayMode" value="scroll" /> スクロール</label>
          </div>

          <div class="field">
            <label class="label" for="pageTurnEffectSelect">ページめくり効果</label>
            <select id="pageTurnEffectSelect">
              <option value="none">なし</option>
              <option value="flash">フラッシュ</option>
              <option value="slide">スライド</option>
              <option value="shadow">紙影</option>
            </select>
          </div>

          <div class="field">
            <label><input id="pageColumnsCheck" type="checkbox" /> ページ内の段組みを許可する</label>
          </div>

          <div class="field">
            <label class="label" for="writingModeSelect">文字組み</label>
            <select id="writingModeSelect">
              <option value="auto">auto（本文から判定）</option>
              <option value="vertical" selected>vertical（縦書き）</option>
              <option value="horizontal">horizontal（横書き）</option>
            </select>
          </div>

          <div class="field">
            <label><input id="wheelPagingCheck" type="checkbox" /> Windowsでホイール上下をページ送りにする</label>
          </div>

          <div class="field">
            <label><input id="structureAutoDetectCheck" type="checkbox" checked /> TXTの章を自動判別する</label>
          </div>
        </div>
      </section>

      <section class="settings-group open" data-settings-group>
        <button
          class="settings-group-toggle"
          type="button"
          data-settings-group-toggle
          aria-expanded="true"
          aria-controls="settingsReloadBody"
        >
          再起動と操作
        </button>
        <div class="settings-group-body" id="settingsReloadBody">
          <div class="field">
            <button class="button ghost" id="exportBtn" type="button" data-export-control>バックアップZIP保存</button>
            <button class="button ghost" id="printBtn" type="button">印刷</button>
          </div>
          <div class="field">
            <button class="button ghost" id="reloadBtn" type="button">再起動（リロード）</button>
            <button class="button ghost danger" id="hardReloadBtn" type="button">強制同期（キャッシュ破棄）</button>
          </div>
        </div>
      </section>

      <div class="build-info">
        <div class="build-row">
          <span class="build-label">Version</span>
          <span id="settingsVersion">-</span>
        </div>
        <div class="build-row">
          <span class="build-label">Build time</span>
          <span id="settingsBuildTime">-</span>
        </div>
        <div class="build-row">
          <span class="build-label">Commit</span>
          <span id="settingsCommit">-</span>
        </div>
      </div>
      <div class="privacy-notice settings-privacy" data-analytics-notice hidden></div>
      <div class="copyright-footer settings-copyright"></div>
    </div>
  </aside>
</section>
