<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>TsukuyomiReader Public Smoke Tests</title>
  <style>
    body { margin: 0; padding: 24px; font-family: system-ui, sans-serif; color: #17171d; background: #f5f6f8; }
    main { max-width: 820px; margin: 0 auto; }
    h1 { font-size: 1.5rem; }
    table { width: 100%; border-collapse: collapse; background: #fff; }
    th, td { padding: 12px; border: 1px solid #c7cad1; text-align: left; vertical-align: top; }
    .pass { color: #176b37; font-weight: 700; }
    .fail { color: #b42318; font-weight: 700; }
    .running { color: #685700; }
    pre { margin: 0; white-space: pre-wrap; font-size: 0.8rem; }
    #frames { position: fixed; inline-size: 1px; block-size: 1px; overflow: hidden; clip-path: inset(50%); }
  </style>
</head>
<body>
  <main>
    <h1>TsukuyomiReader Public Smoke Tests</h1>
    <p id="summary" class="running">RUNNING</p>
    <table>
      <thead><tr><th>Test</th><th>Status</th><th>Detail</th></tr></thead>
      <tbody id="results"></tbody>
    </table>
    <div id="frames" aria-hidden="true"></div>
  </main>
  <script type="module" src="./public-smoke.js"></script>
</body>
</html>
