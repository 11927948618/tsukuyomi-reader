<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Webコンテンツ見本</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <h1>Webコンテンツ見本</h1>
    <p class="note">この画面は、端末に保存されたパッケージ（ZIP）から<strong>通信なし</strong>で動いています。</p>
    <canvas id="clock" width="160" height="160" aria-label="時計"></canvas>
    <p id="today"></p>
    <section id="quiz">
      <h2 id="question"></h2>
      <div id="choices"></div>
      <p id="result" role="status"></p>
    </section>
    <p class="small">データ: <span id="meta"></span></p>
    <button id="exit" type="button">閉じる</button>
  </main>
  <script type="module" src="js/main.js"></script>
</body>
</html>
